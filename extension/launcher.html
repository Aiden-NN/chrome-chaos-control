<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <script src="view.js"></script>
    <title>Chaos Control · Tabs & History</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-tab" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M9.5 14.5l5-5M10 9.5h4.5V14"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3.5h6l-1 5.5 3 3v1.5H7V12l3-3z"/><path d="M12 13.5v7"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7.5 3.5h9a1.5 1.5 0 0 1 1.5 1.5v15.5l-6-4.2-6 4.2V5a1.5 1.5 0 0 1 1.5-1.5z"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 3.5 5.4 3.5 8.5s-1.1 5.9-3.5 8.5c-2.4-2.6-3.5-5.4-3.5-8.5s1.1-5.9 3.5-8.5z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></symbol>
      <symbol id="i-enter" viewBox="0 0 24 24"><path d="M19 5.5V11a3 3 0 0 1-3 3H6"/><path d="M10 10l-4 4 4 4"/></symbol>
      <symbol id="i-switch" viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="11" rx="2"/><path d="M7 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-2M6 9.5h7m-3-3 3 3-3 3"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M13 4h7v7M20 4l-9 9M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
      <symbol id="i-duplicate" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
      <symbol id="i-update" viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2.5"/><path d="M7 10.5h.01M10.5 10.5h.01M14 10.5h.01M17.5 10.5h.01M8 14h8"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
      <symbol id="i-brand" viewBox="0 0 24 24"><path d="M6 18L18 6M8.5 6H18v9.5"/></symbol>
    </svg>
    <main class="launcher" aria-label="Chaos Control launcher">
      <header>
        <span class="wordmark"><svg class="brand" aria-hidden="true"><use href="#i-brand"/></svg>chaos control</span>
        <span class="tagline">A shorter way there.</span>
      </header>
      <section class="palette" id="palette" data-mode="all" aria-label="Find a tab or bookmark">
        <div class="aurora" aria-hidden="true"></div>
        <div class="modebar">
          <button id="back" type="button" hidden aria-label="Go back"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
          <span id="mode-label">Tabs & history</span>
          <button id="actions" type="button">Actions <kbd>tab</kbd></button>
        </div>
        <div class="input-row">
          <svg class="search-icon" aria-hidden="true"><use href="#i-search"/></svg>
          <label class="sr-only" for="query">Search tabs and bookmarks</label>
          <input id="query" type="text" placeholder="Search tabs and history, or type a URL" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-autocomplete="both" aria-expanded="true" aria-controls="results" aria-describedby="keyboard-help">
          <button id="clear" type="button" aria-label="Clear search" hidden><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <div id="notice" role="status" hidden></div>
        <div id="results" role="listbox" aria-label="Search results" aria-busy="true"></div>
        <div id="empty" hidden><svg aria-hidden="true"><use href="#i-search"/></svg><strong>No matches yet</strong><p>Try a shorter title, a domain, or a bookmark folder.</p></div>
        <footer>
          <span id="keyboard-help"><kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>↵</kbd> open <span id="web-hint"><kbd>⌘</kbd><kbd>↵</kbd> search Google</span><span id="save-hint" hidden><kbd>⌘</kbd><kbd>↵</kbd> save to folder</span> <span id="folder-hint" hidden><kbd>⌥</kbd><kbd>↵</kbd> new folder</span> <kbd>esc</kbd> back</span>
          <span id="count" aria-live="polite">Loading…</span>
          <button id="retry" type="button" hidden>Retry</button>
          <button id="load-more-history" type="button" aria-controls="results" hidden>Load more</button>
        </footer>
      </section>
      <p class="page-hint">Open tabs first, then recent history. Press Tab for bookmarks and actions.</p>
    </main>
  </body>
</html>
